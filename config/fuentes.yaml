  # Tier A — nucleo. Oficiales, gratuitas, aptas para produccion.
  # --------------------------------------------------------------------------

  - id: sec_edgar
    name: SEC EDGAR
    country: us
    data_type: [fundamentales, filings, insiders, corporate_actions, metadatos]
    source_url: https://www.sec.gov/search-filings
    api_url: https://data.sec.gov
    access_method: rest_json
    requires_api_key: false
    free: true
    commercial_use: no_localizado
    storage_allowed: no_localizado
    redistribution_allowed: no_localizado
    attribution_required: false
    rate_limit: "10 req/s agregadas por IP. User-agent declarado obligatorio."
    update_frequency: continua
    historical_depth: "XBRL desde ~2009; filings desde 1993"
    license: no_localizada
    terms_url: https://www.sec.gov/about/webmaster-frequently-asked-questions
    status: APPROVED_WITH_RESTRICTIONS
    tier: 1
    priority: 1
    verification: PROVISIONAL
    last_verified: null
    adaptador: null
    notes: >
      No se ha localizado ninguna restriccion, que no es lo mismo que haber leido
      una autorizacion. Es el punto 1 de la verificacion obligatoria y el mayor
      riesgo del proyecto por concentracion. Postura conservadora que ademas es
      buena ingenieria: no redistribuimos filings, extraemos cifras y enlazamos
      al original. Los limites tecnicos (10 req/s, user-agent) van en el
      conector, no en la configuracion.


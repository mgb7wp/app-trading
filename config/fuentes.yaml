# Registro de fuentes de datos.
#
# Esto no es documentacion: es un control que se aplica al arrancar. El estado de
# cada fuente decide si se puede instanciar, y en produccion una fuente que no
# este aprobada hace fallar el arranque en vez de colarse sin que nadie se entere.
#
# El esquema es el del §22 del encargo. Los estados:
#
#   APPROVED                     se puede usar en produccion
#   APPROVED_WITH_RESTRICTIONS   se usa, con sus condiciones anotadas
#   DEVELOPMENT_ONLY             funciona en local; en produccion, error al arrancar
#   REJECTED                     no se instancia nunca
#   NEEDS_REVIEW                 no se instancia nunca, y ademas hay trabajo pendiente
#
# El razonamiento detras de cada estado esta en docs/data-licensing.md, con el
# enlace a los terminos oficiales de cada fuente.
#
# AVISO: `verificacion: PROVISIONAL` significa que el enlace oficial esta
# localizado pero NADIE HA LEIDO EL TEXTO. Un PROVISIONAL favorable no es permiso
# para usar la fuente con clientes de pago; es una hipotesis con un sitio donde
# comprobarla. `last_verified: null` en todas las fuentes quiere decir exactamente
# eso: hoy no hay ninguna verificada.

version: 1

# Como se decide si estamos en produccion.
#
# El valor por defecto es `produccion` a proposito, y va en contra de lo comodo.
# Si el defecto fuera `desarrollo`, olvidarse de poner la variable en el
# despliegue dejaria correr en produccion una fuente con problemas de licencia,
# en silencio. Con este defecto, olvidarse de ponerla en local da un error
# ruidoso que se arregla en diez segundos. El error barato es el de fallar.
entorno:
  variable: LALONJA_ENTORNO
  por_defecto: produccion
  estados_aptos_en_produccion:
    - APPROVED
    - APPROVED_WITH_RESTRICTIONS
  estados_aptos_en_desarrollo:
    - APPROVED
    - APPROVED_WITH_RESTRICTIONS
    - DEVELOPMENT_ONLY

fuentes:


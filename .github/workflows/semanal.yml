# Ciclo semanal: descargar datos reales, archivar la foto, publicar el informe.
#
# Este workflow no es solo automatizacion. La app se desarrollo entera sin
# acceso a ningun proveedor real, asi que ESTA es la primera vez que el sistema
# toca datos de verdad: GitHub Actions si llega a Yahoo Finance.
#
# Se ejecuta el lunes por la manana, con el cierre del viernes ya dentro y la
# revision semanal de la estrategia recien hecha.

name: Ciclo semanal

on:
  schedule:
    # Lunes a las 07:30 UTC. Los mercados llevan el fin de semana cerrados, asi
    # que el ultimo cierre disponible es el del viernes en todos ellos.
    - cron: "30 7 * * 1"
  workflow_dispatch:
    inputs:
      proveedor:
        description: "Forzar una sola fuente (vacio = el reparto de reglas.yaml)"
        required: false
        default: ""
      publicar:
        description: "Desplegar el sitio a Cloudflare Pages"
        type: boolean
        required: false
        default: true

# Dos ejecuciones a la vez se pisarian al hacer commit de la foto.
concurrency:
  group: ciclo-semanal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar
        run: pip install -e ".[panel,dev]"

      # Primero los tests. Si fallan no se publica nada: mas vale el informe de
      # la semana pasada que uno generado por un commit roto.
      - name: Tests
        run: pytest -q

      - name: Comprobar las fuentes
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          PROV="${{ github.event.inputs.proveedor }}"
          ARGS=""
          [ -n "$PROV" ] && ARGS="--proveedor $PROV"
          # El diagnostico no corta la ejecucion: informa. Un universo con
          # huecos sigue siendo operable, y lo que interesa es la lista.
          estrategia $ARGS diagnostico --anos 8 || true

      - name: Descargar datos
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          PROV="${{ github.event.inputs.proveedor }}"
          ARGS=""
          [ -n "$PROV" ] && ARGS="--proveedor $PROV"
          estrategia $ARGS datos --anos 10

      # La foto es el activo que se acumula: cada semana guarda lo que se veia
      # en ese momento, y el historial de git le pone fecha.
      - name: Foto semanal
        env:
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
        run: |
          PROV="${{ github.event.inputs.proveedor }}"
          ARGS=""
          [ -n "$PROV" ] && ARGS="--proveedor $PROV"
          estrategia $ARGS foto --anos 10

      - name: Generar el informe
        run: |
          PROV="${{ github.event.inputs.proveedor }}"
          ARGS=""
          [ -n "$PROV" ] && ARGS="--proveedor $PROV"
          estrategia $ARGS informe --periodo todo --formato ambos

      - name: Archivar la foto y el sitio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/fotos sitio
          if git diff --cached --quiet; then
            echo "Nada que archivar esta semana."
          else
            SEMANA=$(date -u +%G-S%V)
            git commit -m "Foto e informe de $SEMANA

          Generado automaticamente por el ciclo semanal."
            # Otro push puede haberse adelantado mientras corria la descarga.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publicar en Cloudflare Pages
        if: ${{ github.event.inputs.publicar != 'false' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy sitio --project-name=app-trading

      - name: Guardar los resultados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados
          path: |
            datos/resultados/
            sitio/
          retention-days: 30
